<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Certification Library</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/shell.css">
</head>
<body data-page="library" data-root="">
  <div class="backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost small" id="menu-toggle" type="button" aria-label="Open menu">☰</button>
        <span class="crumb">Library</span>
        <button class="btn small" id="theme-toggle" type="button"><span class="theme-label">Light</span></button>
      </header>

      <div class="dash">
        <div class="hero">
          <div class="hero-top">
            <div>
              <div class="eyebrow">Learning Certificates <span>· offline exam prep</span></div>
              <h1>Certification Library</h1>
              <p class="lead">Each certificate is a small study course: notes, quiz, flashcards, mock tests and
                spaced repetition. Open on your phone, install to the home screen and study offline.</p>
            </div>
          </div>
        </div>

        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="book-search" type="search" placeholder="Search certificates or providers...">
        </div>

        <div class="book-grid" id="book-grid"></div>

        <p class="install-hint" id="install-hint" hidden></p>

        <footer class="library-foot">
          <span>Certificates available: <strong id="book-count">0</strong></span>
        </footer>
      </div>
    </div>
  </div>

  <script src="assets/data/library.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/pwa.js"></script>
</body>
</html>
